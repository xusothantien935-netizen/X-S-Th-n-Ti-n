
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | HearPaw</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F5F0E6;
      color: #414B35;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 390px;
      padding: 32px;
      border-radius: 20px;
      background: #FFFDF8;
      box-shadow: 0 8px 30px #414B3518;
    }
    h1 { text-align: center; margin-bottom: 8px; }
    p { text-align: center; color: #687653; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 16px;
    }
    input { border: 1px solid #d8d8cc; }
    button {
      border: 0;
      background: #687653;
      color: white;
      cursor: pointer;
    }
    #message { color: #b42318; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🐾 HearPaw</h1>
    <p>Luôn bên cạnh những người bạn nhỏ</p>
    <h2>Đăng nhập</h2>
    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Email" required>
      <input id="password" type="password"
        placeholder="Mật khẩu demo" required>
      <button type="submit">Đăng nhập</button>
      <p id="message" role="alert"></p>
    </form>
    <p style="font-size:12px">
      Bản demo: dùng tài khoản mẫu bên dưới.
    </p>
  </main>

  <script>
    // Tài khoản DEMO, không dùng cho website thật.
    const demoEmail = "demo@hearpaw.vn";
    const demoPassword = "123456";

    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();
        const password =
          document.getElementById("password").value;
        const message =
          document.getElementById("message");

        if (email === demoEmail &&
            password === demoPassword) {
          sessionStorage.setItem("hearpawDemoLogin", "yes");
          window.location.href = "index.html";
        } else {
          message.textContent =
            "Email hoặc mật khẩu chưa đúng.";
        }
      });
  </script>
</body>
</html>
